<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #mensagem {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Site</h1>

    <form id="loginForm">

        <label for="email">E-mail</label>

        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
        >

        <label for="senha">Senha</label>

        <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

        <div id="mensagem"></div>

    </form>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const senha = document.getElementById("senha").value.trim();

    const mensagem = document.getElementById("mensagem");


    // =====================================
    // LOGIN ADMINISTRADOR
    // =====================================

    if (
        email === "admin@shalom.com" &&
        senha === "123456"
    ) {

        localStorage.clear();

        localStorage.setItem(
            "tipoUsuario",
            "admin"
        );

        localStorage.setItem(
            "usuarioLogado",
            "admin@shalom.com"
        );

        localStorage.setItem(
            "nomeUsuario",
            "Administrador"
        );

        // Abre o painel
        window.location.href = "./admin.html";

        return;
    }


    // =====================================
    // LOGIN CLIENTE
    // =====================================

    let usuarios = [];

    try {

        usuarios = JSON.parse(
            localStorage.getItem("usuariosShalom")
        ) || [];

    } catch (erro) {

        usuarios = [];

    }


    const cliente = usuarios.find(function(usuario) {

        return (
            usuario.email &&
            usuario.senha &&
            usuario.email.toLowerCase() === email &&
            usuario.senha === senha
        );

    });


    if (cliente) {

        localStorage.setItem(
            "tipoUsuario",
            "cliente"
        );

        localStorage.setItem(
            "usuarioLogado",
            cliente.email
        );

        localStorage.setItem(
            "usuarioNome",
            cliente.nome || "Cliente"
        );

        localStorage.setItem(
            "clienteNome",
            cliente.nome || "Cliente"
        );

        window.location.href = "./index.html";

        return;
    }


    // =====================================
    // LOGIN INCORRETO
    // =====================================

    mensagem.textContent =
        "E-mail ou senha incorretos.";

    mensagem.style.color = "red";

});

</script>

</body>
</html>
